[workspace]
resolver = "2"
members = [
  "crates/guardian-core",
  "crates/crypto-discovery",
  "crates/quantum-risk",
  "crates/pqc-intelligence",
  "crates/migration-architect",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
